<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <rect width="1200" height="900" fill="#FAF7F2"/>
  
    <g transform="translate(0, -10)">
      
    <!-- ROYAL PERSIAN SHAMSA / FRENCH MAISON MONOGRAM CREST WITH EXPLICIT INNER BACKGROUND COLOR -->
    <g transform="translate(600, 295) scale(1.08)" filter="none">
      <!-- Outer Octagonal Shamsa Star Geometry (Persian Khatam Motif) -->
      <!-- Explicit inner background disc so inside of Shamsa is always bg_fill (Matte Black or Ivory) -->
      <circle cx="0" cy="0" r="82" fill="#FAF7F2"/>
      
      <g stroke="#27272A" stroke-width="1.6" fill="none" opacity="0.95">
        <polygon points="0,-82 58,-58 82,0 58,58 0,82 -58,58 -82,0 -58,-58" stroke-width="2.2"/>
        <polygon points="0,-68 48,-48 68,0 48,48 0,68 -48,48 -68,0 -48,-48" stroke-width="1.2" opacity="0.85"/>
        
        <path d="M 0,-94 L 7,-78 L 0,-82 L -7,-78 Z" fill="#18181B"/>
        <path d="M 0,94 L 7,78 L 0,82 L -7,-78 Z" fill="#18181B"/>
        <path d="M -94,0 L -78,7 L -82,0 L -78,-7 Z" fill="#18181B"/>
        <path d="M 94,0 L 78,7 L 82,0 L 78,-7 Z" fill="#18181B"/>
        
        <path d="M 66,-66 L 50,-55 L 58,-58 L 55,-50 Z" fill="#18181B"/>
        <path d="M -66,-66 L -50,-55 L -58,-58 L -55,-50 Z" fill="#18181B"/>
        <path d="M 66,66 L 50,55 L 58,58 L 55,50 Z" fill="#18181B"/>
        <path d="M -66,66 L -50,55 L -58,58 L -55,-50 Z" fill="#18181B"/>
      </g>

      <!-- Inner Geometry Rings -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#27272A" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85"/>
      <circle cx="0" cy="0" r="48" fill="#FAF7F2" stroke="#27272A" stroke-width="1.8"/>

      <!-- Persian-French Haute Calligraphy Monogram 'R' -->
      <g fill="#18181B">
        <!-- High contrast Didot stem with classic serifs -->
        <path d="M -22,-32 L -14,-32 L -14,28 L -22,28 L -22,32 L -4,32 L -4,28 L -10,28 L -10,-28 L -4,-28 L -4,-32 L -22,-32 Z"/>
        <!-- Upper Bowl and Royal Flourish Loop -->
        <path d="M -10,-32 C 5,-32 24,-33 24,-14 C 24,1 12,6 -4,7 L -10,7 L -10,-32 Z M -6,-28 L -6,3 C 7,3 18,1 18,-13 C 18,-27 7,-28 -6,-28 Z"/>
        <!-- Persian Royal Calligraphy Sweeping Tail -->
        <path d="M -1,4 C 6,4 12,14 19,25 C 23,31 27,33 34,32 L 34,28 C 29,29 25,26 21,20 C 14,10 9,1 2,1 L -10,1 L -10,5 L -1,4 Z"/>
        <!-- Diamond Royal Accent Dot -->
        <polygon points="4,-15 6,-13 4,-11 2,-13" fill="#18181B"/>
      </g>
    </g>
    
      <text x="600" y="485" font-family="Gandom, Tahoma, serif" font-size="96px" font-weight="700" fill="#18181B" letter-spacing="0" text-anchor="middle">ﻥﺎﻣﺩﺍﺭ</text>
      
    <g transform="translate(600, 538) scale(1.0)">
      <path d="M -170,0 L -38,0" stroke="#27272A" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-170" cy="0" r="2" fill="#18181B"/>
      <polygon points="-110,-3 -107,0 -110,3 -113,0" fill="#18181B" opacity="0.8"/>
      
      <g fill="#18181B">
        <polygon points="0,-14 5,-5 14,0 5,5 0,14 -5,5 -14,0 -5,-5" opacity="0.95"/>
        <polygon points="0,-10 7,-7 10,0 7,7 0,10 -7,7 -10,0 -7,-7" fill="none" stroke="#27272A" stroke-width="1.2"/>
        <polygon points="0,-5 5,0 0,5 -5,0" fill="#FAF7F2"/>
        <circle cx="0" cy="0" r="1.5" fill="#18181B"/>
        
        <polygon points="-24,0 -20,-3.5 -16,0 -20,3.5"/>
        <polygon points="24,0 20,-3.5 16,0 20,3.5"/>
        <circle cx="0" cy="-21" r="1.8" fill="#18181B"/>
        <circle cx="0" cy="21" r="1.8" fill="#18181B"/>
      </g>
      
      <path d="M 38,0 L 170,0" stroke="#27272A" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
      <circle cx="170" cy="0" r="2" fill="#18181B"/>
      <polygon points="110,-3 113,0 110,3 107,0" fill="#18181B" opacity="0.8"/>
    </g>
    
      <text x="600" y="598" font-family="Gandom, Tahoma, sans-serif" font-size="28px" font-weight="700" fill="#18181B" letter-spacing="0" text-anchor="middle">۹۲۵ ﺭﻮﻠﯿﺳ</text>
      <g transform="translate(600, 665)" opacity="0.85">
        <rect x="-135" y="-14" width="270" height="28" rx="2" fill="none" stroke="#3F3F46" stroke-width="1" opacity="0.6"/>
        <text x="0" y="6" font-family="Gandom, Tahoma, serif" font-size="14px" font-weight="700" fill="#3F3F46" letter-spacing="0" text-anchor="middle">ﻥﺍﺮﯾﺍ • ﻩﺮﻘﻧ ﺕﺍﺮﻫﺍﻮﺟ ﻪﻋﻮﻤﺠﻣ</text>
      </g>
    </g>
    
</svg>