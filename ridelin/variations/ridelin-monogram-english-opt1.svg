<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="96" fill="#0D0D10"/>
  
    <!-- CRYSTAL CLEAR ENGLISH CAPITAL 'R' IN CHIC RING -->
    <g transform="translate(256, 256) scale(1.0)">
      <!-- Outer Chic Ring Frame -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="#D9DCE3" stroke-width="6" opacity="0.9"/>
      <circle cx="0" cy="0" r="142" fill="none" stroke="#503A70" stroke-width="3" stroke-dasharray="16 10" opacity="0.85"/>
      <circle cx="0" cy="-160" r="7" fill="#8664B0"/>
      
      <!-- Pristine, Unmistakable English Capital 'R' -->
      <!-- Vertical stem (-60 to 70), round bowl, classic sturdy diagonal leg -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Vertical Stem -->
        <line x1="-55" y1="-95" x2="-55" y2="95" stroke="#D9DCE3" stroke-width="26"/>
        <!-- Upper Bowl (Classic English R loop) -->
        <path d="M -55,-95 L 20,-95 C 65,-95 85,-65 85,-30 C 85,5 65,30 20,30 L -55,30" fill="none" stroke="#D9DCE3" stroke-width="26"/>
        <!-- Classic Sturdy Diagonal Leg (50 deg English R leg, NO trailing Persian crescent) -->
        <line x1="5" y1="25" x2="70" y2="95" stroke="#D9DCE3" stroke-width="26"/>
        <!-- Royal Purple Accent inside bowl -->
        <circle cx="-10" cy="-32" r="10" fill="#503A70"/>
      </g>
    </g>
    
</svg>