<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="256" fill="#0D0D10"/>
  
    <g transform="translate(256, 256) scale(1.0)">
      <!-- Aerodynamic Octagonal Medallion Frame -->
      <g stroke="#D9DCE3" stroke-width="5" fill="none" stroke-linejoin="round">
        <polygon points="0,-170 120,-120 170,0 120,120 0,170 -120,120 -170,0 -120,-120"/>
        <polygon points="0,-150 105,-105 150,0 105,105 0,150 -105,105 -150,0 -105,-105" stroke="#503A70" stroke-width="3" opacity="0.8"/>
      </g>
      <!-- Radiant Points -->
      <circle cx="0" cy="-170" r="6" fill="#8664B0"/>
      <circle cx="0" cy="170" r="6" fill="#8664B0"/>
      
      <!-- Modern Bold Geometric 'R' with Integrated Speed Slash -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <line x1="-40" y1="-80" x2="-40" y2="80" stroke="#D9DCE3" stroke-width="24"/>
        <path d="M -40,-80 L 25,-80 C 68,-80 88,-55 88,-20 C 88,15 68,35 25,35 L -40,35" fill="none" stroke="#D9DCE3" stroke-width="24"/>
        <path d="M 0,35 C 25,35 45,55 75,82" fill="none" stroke="#503A70" stroke-width="24"/>
        <path d="M 0,35 C 25,35 45,55 75,82" fill="none" stroke="#8664B0" stroke-width="8" opacity="0.9"/>
      </g>
      <!-- Speed Blade Slash Line Inside Badge -->
      <path d="M -90,95 L 90,95" stroke="#D9DCE3" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    </g>
    
</svg>