<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="96" fill="#0D0D10"/>
  
    <g transform="translate(256, 256) scale(1.0)">
      <!-- Clean Chic Circle -->
      <circle cx="0" cy="0" r="165" fill="none" stroke="#E2E8F0" stroke-width="5" opacity="0.75"/>
      <circle cx="0" cy="0" r="150" fill="none" stroke="#5C1D24" stroke-width="2" stroke-dasharray="10 6" opacity="0.6"/>
      
      <!-- Pure English Capital 'R' positioned slightly above center -->
      <g transform="translate(0, -25)" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-55" y1="-75" x2="-55" y2="75" stroke="#E2E8F0" stroke-width="26"/>
        <path d="M -55,-75 L 18,-75 C 65,-75 85,-48 85,-15 C 85,18 65,40 18,40 L -55,40" fill="none" stroke="#E2E8F0" stroke-width="26"/>
        <line x1="5" y1="35" x2="68" y2="75" stroke="#E2E8F0" stroke-width="26"/>
      </g>
      
      <!-- Horizontal Horizon Blade Line ('Ye Khat') below R -->
      <g transform="translate(-115, 95)">
        <path d="M 0,0 L 200,0 L 215,-6 L 8,-6 Z" fill="#5C1D24"/>
        <path d="M 0,0 L 200,0 L 215,-2.5 L 8,-2.5 Z" fill="#9B3842"/>
        <polygon points="222,-6 242,-6 235,0 215,0" fill="#E2E8F0"/>
      </g>
    </g>
    
</svg>