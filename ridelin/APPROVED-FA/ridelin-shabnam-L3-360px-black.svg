  <text x="1340" y="65" font-family="Tahoma, sans-serif" font-size="12px" font-weight="700" fill="#8A2747" style="text-anchor: end; opacity: 0.6;">(ﺕﺮﭙﺳﺍ ﻭ ﻝﺎﻤﯿﻨﯿﻣ) ﻞﺴﮑﯿﭘ ۳۶۰ ﻩﺎﺗﻮﮐ ﺖﻋﺮﺳ ﻂﺧ — (Bold ﻢﻨﺒﺷ ﺖﻧﻮﻓ) ﻦﯿﻟﺪﯾﺍﺭ</text>
