<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@600;700&amp;display=swap');
    
    .header-wordmark {
      font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Cormorant Garamond', serif;
      font-size: 88px;
      font-weight: 700;
      fill: #000000;
      letter-spacing: 0.28em;
      text-anchor: start;
    }
    
    .header-tagline {
      font-family: 'Montserrat', 'Helvetica Neue', sans-serif;
      font-size: 24px;
      font-weight: 600;
      fill: #000000;
      letter-spacing: 0.55em;
      text-anchor: start;
    }
  </style>

  <!-- Direction D — Horizontal Store Header Logo -->
  <g transform="translate(180, 160)">
    <!-- Left Monogram Icon -->
    <g transform="translate(0, 0) scale(0.48)">
      
    <!-- Bold Octagonal Shamsa Star Frame -->
    <g stroke="#000000" stroke-width="16" fill="none" stroke-linejoin="round">
      <polygon points="0,-190 134,-134 190,0 134,134 0,190 -134,134 -190,0 -134,-134"/>
      <polygon points="0,-145 102,-102 145,0 102,102 0,145 -102,102 -145,0 -102,-102" stroke-width="8" opacity="0.7"/>
    </g>
    
    <!-- Bold Classic French Serif + Persian Calligraphy Sweep 'R' Monogram -->
    <g fill="#000000">
      <!-- Vertical Stem -->
      <path d="M -64,-96 L -36,-96 L -36,78 L -64,78 L -64,96 L -6,96 L -6,78 L -20,78 L -20,-78 L -6,-78 L -6,-96 L -64,-96 Z"/>
      
      <!-- Upper Bowl -->
      <path d="M -20,-96 C 30,-96 76,-94 76,-38 C 76,8 36,24 -12,26 L -20,26 L -20,-96 Z M -4,-74 L -4,4 C 34,4 52,-2 52,-36 C 52,-70 28,-74 -4,-74 Z"/>
      
      <!-- Persian Sweeping Tail -->
      <path d="M 0,14 C 18,14 40,42 64,74 C 74,88 84,96 106,96 L 106,78 C 92,78 82,70 70,52 C 46,22 30,-2 4,-2 L -20,-2 L -20,16 L 0,14 Z"/>
      
      <!-- Diamond Accent Dot -->
      <polygon points="18,-36 26,-28 18,-20 10,-28"/>
    </g>
    
    </g>
    
    <!-- Divider Rule -->
    <line x1="160" y1="-80" x2="160" y2="80" stroke="#000000" stroke-width="3" opacity="0.5"/>
    
    <!-- Right Wordmark & Tagline -->
    <g transform="translate(220, 15)">
      <text x="0" y="0" class="header-wordmark">
        <tspan x="0">R</tspan>
        <tspan x="80">A</tspan>
        <tspan x="160">D</tspan>
        <tspan x="240">M</tspan>
        <tspan x="320">A</tspan>
        <tspan x="400">N</tspan>
      </text>
      <text x="4" y="55" class="header-tagline">
        <tspan x="4">S</tspan>
        <tspan x="34">I</tspan>
        <tspan x="64">L</tspan>
        <tspan x="94">V</tspan>
        <tspan x="124">E</tspan>
        <tspan x="154">R</tspan>
        <tspan x="224">9</tspan>
        <tspan x="254">2</tspan>
        <tspan x="284">5</tspan>
      </text>
    </g>
  </g>
</svg>