<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;display=swap');
    
    .wordmark-text {
      font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Cormorant Garamond', serif;
      font-size: 96px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.28em;
      text-anchor: middle;
    }
  </style>

  <g transform="translate(0, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="600" y="175" class="wordmark-text" aria-label="RADMAN">
      <tspan x="415">R</tspan>
      <tspan x="489">A</tspan>
      <tspan x="563">D</tspan>
      <tspan x="637">M</tspan>
      <tspan x="711">A</tspan>
      <tspan x="785">N</tspan>
    </text>
    
    <!-- Simplified Centered Persian Shamsa Star Ornament -->
    <g transform="translate(600, 275)" fill="#FFFFFF" stroke="#FFFFFF">
      <!-- Flanking Horizontal Rules -->
      <path d="M -120,0 L -40,0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <circle cx="-120" cy="0" r="2.5" fill="#FFFFFF"/>
      <circle cx="-75" cy="0" r="1.5" fill="#FFFFFF" opacity="0.6"/>
      
      <!-- Center 8-Pointed Star Rosette -->
      <polygon points="0,-18 5,-6 18,0 5,6 0,18 -5,6 -18,0 -5,-6" stroke-width="1"/>
      <polygon points="0,-12 9,-9 12,0 9,9 0,12 -9,9 -12,0 -9,-9" fill="none" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      
      <!-- Right Flanking Rule -->
      <path d="M 40,0 L 120,0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <circle cx="120" cy="0" r="2.5" fill="#FFFFFF"/>
      <circle cx="75" cy="0" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>
</svg>