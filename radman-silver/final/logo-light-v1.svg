<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  
  <defs>
    <!-- Ivory / Pure White Paper Texture Background -->
    <radialGradient id="bg-light" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#F2F3F5"/>
    </radialGradient>

    <!-- Elegant Charcoal Black Typography Gradient -->
    <linearGradient id="charcoal-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>

    <!-- Soft Warm Silver Metal Foil for Accents -->
    <linearGradient id="silver-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717A"/>
      <stop offset="50%" stop-color="#52525B"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>

    <!-- Subtle Letterpress Deboss Shadow -->
    <filter id="deboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Fine Paper Grain -->
    <pattern id="paper-grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="#000000" fill-opacity="0.015"/>
      <circle cx="3" cy="3" r="0.4" fill="#000000" fill-opacity="0.02"/>
    </pattern>
  </defs>


  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&amp;family=Montserrat:wght@300;400;500&amp;display=swap');
    
    .brand-title-light {
      font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Bodoni MT', serif;
      font-size: 66px;
      font-weight: 500;
      fill: url(#charcoal-text);
      text-anchor: middle;
      filter: url(#deboss);
    }
    
    .brand-tagline-light {
      font-family: 'Montserrat', 'Helvetica Neue', 'Arial', sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #3F3F46;
      text-anchor: middle;
      opacity: 0.95;
      filter: url(#deboss);
    }

    .est-text-light {
      font-family: 'Cinzel', 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 500;
      fill: #52525B;
      letter-spacing: 0.38em;
      text-anchor: middle;
      opacity: 0.8;
    }
  </style>

  <!-- Pure White / Textured Ivory Background -->
  <rect width="1200" height="900" fill="url(#bg-light)"/>
  <rect width="1200" height="900" fill="url(#paper-grain)"/>

  <!-- Subtle Luxury Framing Border -->
  <rect x="50" y="50" width="1100" height="800" rx="4" fill="none" stroke="#E4E4E7" stroke-width="1"/>
  <rect x="62" y="62" width="1076" height="776" rx="2" fill="none" stroke="#F4F4F5" stroke-width="0.75"/>
  
  <!-- Corner Persian Shamsa Frame Accents -->
  <g stroke="#A1A1AA" stroke-width="0.75" stroke-opacity="0.6" fill="none">
    <path d="M 50 88 L 88 50 M 62 88 L 88 62" />
    <circle cx="70" cy="70" r="1.5" fill="#71717A"/>
    <path d="M 1150 88 L 1112 50 M 1138 88 L 1112 62" />
    <circle cx="1130" cy="70" r="1.5" fill="#71717A"/>
    <path d="M 50 812 L 88 850 M 62 812 L 88 838" />
    <circle cx="70" cy="830" r="1.5" fill="#71717A"/>
    <path d="M 1150 812 L 1112 850 M 1138 812 L 1112 838" />
    <circle cx="1130" cy="830" r="1.5" fill="#71717A"/>
  </g>

  <!-- CENTERED LOGO COMPOSITION -->
  <g transform="translate(0, -10)">
    
    <!-- 1. ROYAL MONOGRAM CREST (IN CHARCOAL & WARM SILVER) -->
    
    <!-- ROYAL PERSIAN SHAMSA / FRENCH MAISON MONOGRAM CREST -->
    <g transform="translate(600, 295) scale(1.05)" filter="url(#deboss)">
      <!-- Outer Octagonal Shamsa Star Geometry (Persian Khatam Motif) -->
      <g stroke="#52525B" stroke-width="1.25" fill="none" opacity="0.9">
        <!-- Two intersecting squares forming an 8-pointed star -->
        <polygon points="0,-82 58,-58 82,0 58,58 0,82 -58,58 -82,0 -58,-58" stroke-width="1.6"/>
        <polygon points="0,-68 48,-48 68,0 48,48 0,68 -48,48 -68,0 -48,-48" stroke-width="0.8" opacity="0.65"/>
        
        <!-- 8 Radiant Royal Cusps -->
        <path d="M 0,-94 L 7,-78 L 0,-82 L -7,-78 Z" fill="url(#charcoal-text)"/>
        <path d="M 0,94 L 7,78 L 0,82 L -7,-78 Z" fill="url(#charcoal-text)"/>
        <path d="M -94,0 L -78,7 L -82,0 L -78,-7 Z" fill="url(#charcoal-text)"/>
        <path d="M 94,0 L 78,7 L 82,0 L 78,-7 Z" fill="url(#charcoal-text)"/>
        
        <!-- Diagonal Star Points -->
        <path d="M 66,-66 L 50,-55 L 58,-58 L 55,-50 Z" fill="url(#charcoal-text)"/>
        <path d="M -66,-66 L -50,-55 L -58,-58 L -55,-50 Z" fill="url(#charcoal-text)"/>
        <path d="M 66,66 L 50,55 L 58,58 L 55,50 Z" fill="url(#charcoal-text)"/>
        <path d="M -66,66 L -50,55 L -58,58 L -55,50 Z" fill="url(#charcoal-text)"/>
      </g>

      <!-- Inner Geometry Rings -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#52525B" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#52525B" stroke-width="1.2"/>

      <!-- Persian-French Haute Calligraphy Monogram 'R' -->
      <g fill="url(#charcoal-text)">
        <!-- High contrast Didot stem with classic serifs -->
        <path d="M -22,-32 L -14,-32 L -14,28 L -22,28 L -22,32 L -4,32 L -4,28 L -10,28 L -10,-28 L -4,-28 L -4,-32 L -22,-32 Z"/>
        <!-- Upper Bowl and Royal Flourish Loop -->
        <path d="M -10,-32 C 5,-32 24,-33 24,-14 C 24,1 12,6 -4,7 L -10,7 L -10,-32 Z M -6,-28 L -6,3 C 7,3 18,1 18,-13 C 18,-27 7,-28 -6,-28 Z"/>
        <!-- Persian Royal Calligraphy Sweeping Tail (Nastaliq curve dynamic) -->
        <path d="M -1,4 C 6,4 12,14 19,25 C 23,31 27,33 34,32 L 34,28 C 29,29 25,26 21,20 C 14,10 9,1 2,1 L -10,1 L -10,5 L -1,4 Z"/>
        <!-- Diamond Royal Accent Dot -->
        <polygon points="4,-15 6,-13 4,-11 2,-13" fill="#18181B"/>
      </g>
    </g>
    

    <!-- 2. PRIMARY BRAND NAME: "RADMAN" -->
    <text x="600" y="485" class="brand-title-light" aria-label="RADMAN">
      <tspan x="435">R</tspan>
      <tspan x="501">A</tspan>
      <tspan x="567">D</tspan>
      <tspan x="633">M</tspan>
      <tspan x="699">A</tspan>
      <tspan x="765">N</tspan>
    </text>

    <!-- 3. MINIMALIST PERSIAN ROYAL GEOMETRIC ORNAMENT -->
    
    <!-- MINIMALIST GEOMETRIC PERSIAN STAR ORNAMENT -->
    <g transform="translate(600, 538) scale(1.0)" filter="url(#deboss)">
      <!-- Left Flanking Tapered Rule -->
      <path d="M -170,0 L -38,0" stroke="#71717A" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      <circle cx="-170" cy="0" r="1.5" fill="#3F3F46"/>
      <polygon points="-110,-3 -107,0 -110,3 -113,0" fill="#3F3F46" opacity="0.6"/>
      
      <!-- Central Persian Shamsa / Rosette Star Jewel Motif -->
      <g fill="#3F3F46">
        <!-- Outer 8-pointed star geometry -->
        <polygon points="0,-14 5,-5 14,0 5,5 0,14 -5,5 -14,0 -5,-5" opacity="0.9"/>
        <!-- Intersecting rotated square -->
        <polygon points="0,-10 7,-7 10,0 7,7 0,10 -7,7 -10,0 -7,-7" fill="none" stroke="#71717A" stroke-width="1"/>
        <!-- Inner Diamond Cutout -->
        <polygon points="0,-5 5,0 0,5 -5,0" fill="#111114"/>
        <!-- Center bright dot -->
        <circle cx="0" cy="0" r="1.2" fill="#3F3F46"/>
        
        <!-- Side Accent Diamonds -->
        <polygon points="-24,0 -20,-3.5 -16,0 -20,3.5"/>
        <polygon points="24,0 20,-3.5 16,0 20,3.5"/>
        <!-- Top/Bottom Delicate Accent Points -->
        <circle cx="0" cy="-21" r="1.5" fill="#3F3F46"/>
        <circle cx="0" cy="21" r="1.5" fill="#3F3F46"/>
      </g>
      
      <!-- Right Flanking Tapered Rule -->
      <path d="M 38,0 L 170,0" stroke="#71717A" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      <circle cx="170" cy="0" r="1.5" fill="#3F3F46"/>
      <polygon points="110,-3 113,0 110,3 107,0" fill="#3F3F46" opacity="0.6"/>
    </g>
    

    <!-- 4. SECONDARY TAGLINE: "SILVER 925" -->
    <text x="600" y="598" class="brand-tagline-light" aria-label="SILVER 925">
      <tspan x="456">S</tspan>
      <tspan x="484">I</tspan>
      <tspan x="512">L</tspan>
      <tspan x="540">V</tspan>
      <tspan x="568">E</tspan>
      <tspan x="596">R</tspan>
      <tspan x="644">9</tspan>
      <tspan x="672">2</tspan>
      <tspan x="700">5</tspan>
    </text>

    <!-- 5. HERITAGE / STERLING HALLMARK SIGNATURE -->
    <g transform="translate(600, 665)" opacity="0.85">
      <rect x="-115" y="-13" width="230" height="26" rx="2" fill="none" stroke="#A1A1AA" stroke-width="0.75" opacity="0.6"/>
      <text x="0" y="5" class="est-text-light">STERLING • MAISON • EST. 2026</text>
    </g>

  </g>
</svg>