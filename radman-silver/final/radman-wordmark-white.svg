<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@600;700&amp;display=swap');
    
    .wordmark-text {
      font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Cormorant Garamond', serif;
      font-size: 96px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.28em;
      text-anchor: middle;
    }
    
    .tagline-text {
      font-family: 'Montserrat', 'Helvetica Neue', sans-serif;
      font-size: 24px;
      font-weight: 600;
      fill: #FFFFFF;
      letter-spacing: 0.55em;
      text-anchor: middle;
    }
  </style>

  <!-- Centered High-Contrast Wordmark -->
  <g transform="translate(0, 0)">
    <text x="600" y="145" class="wordmark-text" aria-label="RADMAN">
      <tspan x="415">R</tspan>
      <tspan x="489">A</tspan>
      <tspan x="563">D</tspan>
      <tspan x="637">M</tspan>
      <tspan x="711">A</tspan>
      <tspan x="785">N</tspan>
    </text>
    
    <text x="600" y="225" class="tagline-text" aria-label="SILVER 925">
      <tspan x="435">S</tspan>
      <tspan x="468">I</tspan>
      <tspan x="501">L</tspan>
      <tspan x="534">V</tspan>
      <tspan x="567">E</tspan>
      <tspan x="600">R</tspan>
      <tspan x="666">9</tspan>
      <tspan x="699">2</tspan>
      <tspan x="732">5</tspan>
    </text>
  </g>
</svg>