<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
  <defs>
    <!-- Deep Matte Black Background Texture & Lighting -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#19191D"/>
      <stop offset="50%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#09090B"/>
    </radialGradient>
    
    <!-- Premium Metallic Silver Foil Gradient (Shimmering Horizontal Highlights) -->
    <linearGradient id="silver-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#DCE4EC"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#CBD5E1"/>
      <stop offset="52%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#C8D2DF"/>
      <stop offset="85%" stop-color="#A3AEBC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Bright Silver Highlight Gradient -->
    <linearGradient id="silver-bright" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Metallic Emboss Shadow for Raised Silver Foil -->
    <filter id="foil-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.25"/>
    </filter>

    <!-- Matte Paper Texture Overlay -->
    <pattern id="matte-grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#FFFFFF" fill-opacity="0.015"/>
      <circle cx="3" cy="3" r="0.5" fill="#000000" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="600" height="600" rx="300" fill="url(#bg-glow)"/>
  <circle cx="300" cy="300" r="290" fill="none" stroke="url(#silver-foil)" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="300" cy="300" r="275" fill="none" stroke="url(#silver-foil)" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  
    <!-- ROYAL PERSIAN SHAMSA / FRENCH MAISON MONOGRAM CREST -->
    <g transform="translate(300, 300) scale(1.9)" filter="url(#foil-emboss)">
      <!-- Outer Octagonal Shamsa Star Geometry (Persian Khatam Motif) -->
      <g stroke="url(#silver-foil)" stroke-width="1.25" fill="none" opacity="0.95">
        <!-- Two intersecting squares forming an 8-pointed star -->
        <polygon points="0,-82 58,-58 82,0 58,58 0,82 -58,58 -82,0 -58,-58" stroke-width="1.8"/>
        <polygon points="0,-68 48,-48 68,0 48,48 0,68 -48,48 -68,0 -48,-48" stroke-width="1" opacity="0.75"/>
        
        <!-- 8 Radiant Royal Cusps -->
        <path d="M 0,-94 L 7,-78 L 0,-82 L -7,-78 Z" fill="url(#silver-foil)"/>
        <path d="M 0,94 L 7,78 L 0,82 L -7,-78 Z" fill="url(#silver-foil)"/>
        <path d="M -94,0 L -78,7 L -82,0 L -78,-7 Z" fill="url(#silver-foil)"/>
        <path d="M 94,0 L 78,7 L 82,0 L 78,-7 Z" fill="url(#silver-foil)"/>
        
        <!-- Diagonal Star Points -->
        <path d="M 66,-66 L 50,-55 L 58,-58 L 55,-50 Z" fill="url(#silver-foil)"/>
        <path d="M -66,-66 L -50,-55 L -58,-58 L -55,-50 Z" fill="url(#silver-foil)"/>
        <path d="M 66,66 L 50,55 L 58,58 L 55,50 Z" fill="url(#silver-foil)"/>
        <path d="M -66,66 L -50,55 L -58,58 L -55,50 Z" fill="url(#silver-foil)"/>
      </g>

      <!-- Inner Geometry Rings -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#silver-foil)" stroke-width="1" stroke-dasharray="3 3" opacity="0.75"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="url(#silver-foil)" stroke-width="1.4"/>

      <!-- Persian-French Haute Calligraphy Monogram 'R' -->
      <g fill="url(#silver-foil)">
        <!-- High contrast Didot stem with classic serifs -->
        <path d="M -22,-32 L -14,-32 L -14,28 L -22,28 L -22,32 L -4,32 L -4,28 L -10,28 L -10,-28 L -4,-28 L -4,-32 L -22,-32 Z"/>
        <!-- Upper Bowl and Royal Flourish Loop -->
        <path d="M -10,-32 C 5,-32 24,-33 24,-14 C 24,1 12,6 -4,7 L -10,7 L -10,-32 Z M -6,-28 L -6,3 C 7,3 18,1 18,-13 C 18,-27 7,-28 -6,-28 Z"/>
        <!-- Persian Royal Calligraphy Sweeping Tail -->
        <path d="M -1,4 C 6,4 12,14 19,25 C 23,31 27,33 34,32 L 34,28 C 29,29 25,26 21,20 C 14,10 9,1 2,1 L -10,1 L -10,5 L -1,4 Z"/>
        <!-- Diamond Royal Accent Dot -->
        <polygon points="4,-15 6,-13 4,-11 2,-13" fill="#FFFFFF"/>
      </g>
    </g>
    
</svg>